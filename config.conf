# ===== Pad 2 Pro 144Hz Fix 配置 (v1.6.2) =====
# 改完配置: 重启, 或模块管理器里点"操作"按钮立即应用; POLICY_* 开关只在开机早期生效, 必须重启

# ---- 刷新率 ----
# v1.5.2: 保 144 靠 peak=144 + min=120(保持 max-min>1, 系统才可切换) + 策略上限。
# SF 1035 在本机实测为空操作, 默认关闭; 看门狗漂移时会重写 min/peak 触发系统 modeset。
REFRESH_PEAK="144.0"       # 峰值刷新率(写入 system peak_refresh_rate)
# 120=保留高刷下限, 允许系统在 120/144 间切换(本机实测: min/peak 相等会让 ColorOS
# 进入"固定刷新率"状态, mRefreshRateChangeable=false, 亮屏后卡 120 不再 modeset)。
# 不要用 144.0; 改 "10.0" = 允许闲时降帧省电。
REFRESH_MIN="120.0"
USER_REFRESH_RATE="144"    # 写入 secure user_refresh_rate
OPLUS_REFRESH_KEY="4"      # secure oplus_customize_screen_refresh_rate: 144档=4
SF_FALLBACK_ID="6"         # 解析失败时的兜底 SF mode id (本机 id6=144)
# SF 1035 在本机 ColorOS 16.0.10.600 实测为空操作: 返回 Parcel(NULL), backdoor pid 始终 0,
# 切不动模式。默认关闭; 仅在其他 ROM/旧版本确认有效时才开。
SF_1035_ENABLE="0"

# ---- 触控(v1.6.2: 档位默认下调, 540Hz 走 game_switch) ----
# 档位表(官方 DTS erhai-oplus-tp-24924.dtsi):
#   sensitive 0=255(出厂) 1=20 2=15 3=12 4=10 5=5    -> 越小越灵敏(内核发固件 EXT_JITTER_LEVEL 0x0C)
#   smooth    0=255(出厂) 1=32 2=64 3=96 4=128 5=254 -> 越大越平滑(EXT_SMOOTH_LEVEL 0x0D)
# 充电时切厂商 charging 表(仅 sensitive 有; 同档 raw 更大, 略保守; smooth 无 charging 表复用普通表), 本模块接受不补写。
# v1.6.2: 默认 4/1 -> 2/3。4/1 是「最灵敏 / 最少平滑」端(raw 10/32, 出厂 255/255 的
# 3.9%/12.5%), FPS 里准星会持续微抖;2/3 = raw 15/96, 仍远灵敏于出厂但保留抗抖/平滑。
# -1 = 本模块不碰该节点; 真机手感反了只改这里, 不改代码。
TOUCH_SENSITIVE_LEVEL="2"  # 2=raw15 均衡; 4=raw10 高灵敏(绘图向, FPS 易抖); 0=出厂
TOUCH_SMOOTH_LEVEL="3"     # 3=raw96 保留平滑; 1=raw32 最少平滑(FPS 易抖); 0=出厂
# ---- 游戏模式 / 高触控轮询率 ----
# `/proc/touchpanel/game_switch_enable=1` = 固件 GAME_ON。系统侧这是「高触控轮询率
# (HighTouchPollingRate)」的唯一用户态入口(LineageOS hardware_oplus 同名 HAL 写的就是它)。
# 本机面板规格上限 540Hz(默认 120Hz), 但内核/DTS 没有 report_rate / high_frame_rate 通道。
# 用户真机观察(2026-11-18): 报点率与显示刷新率绑定≈2×(144Hz 显示→≈288Hz);
# 540Hz 采样仅 90Hz 显示档可达, 与本模块保 144 的目标互斥 —— 144 下现实上限≈288Hz。
# gs=0/1 两态用 `sh tools/touch_rate.sh` 实测确认, 方案见 docs/touch-rate-540-design.md。
TOUCH_GAME_SWITCH="1"      # -1=不碰; 1=写(高轮询率/游戏模式); 0=强制关
TOUCH_IRQ_AFFINITY="auto"  # auto=绑最强CPU簇; 0=关闭; 或CPU列表如 "6 7"
# v1.6.0 触控守护: ColorOS 会把档位改回 0, 只写一次保不住; 独立进程每秒巡检亮屏档位。
# 注意: 每次写 proc 节点会持触控锁 ≥20ms(固件命令 msleep(20) 重试)。守护写回前用触摸 IRQ
# 计数差值探测报点活动并避让(fd_touch_count 受 face_detect_support 门控, 本机不存在);
# 连续避让 TOUCH_GUARD_DEFER_MAX 个 tick 后强制写一次, 避免持续触控时永不写回。
TOUCH_GUARD="pin"          # pin=回退即写回; log=只记录(首次排查用); off=关闭
TOUCH_GUARD_INTERVAL="1"   # 亮屏巡检秒
TOUCH_GUARD_MAX_WRITES="6" # 每分钟写回上限, 超过退避到下一分钟(防 1s 拉锯刷屏)
TOUCH_GUARD_DEFER_MAX="10" # 报点活跃时连续暂缓写回的 tick 数, 达到后强制写一次(≈10s)

# ---- 看门狗(v1.5.2: 验实测/模式/可切换性, 不再默认依赖 SF 1035) ----
WATCH_INTERVAL="10"        # 亮屏稳态巡检间隔(秒); 灭屏固定20s; 连续失败退避至60s封顶
TARGET_HZ="144"

# ---- 策略源头覆盖(ColorOS 截断开关 maxrefreshsettings) ----
# 覆盖副本生成到 <模块>/my_product/etc/, 由元模块合并生效; 本模块不自挂载(v1.5.0)。
# 没装元模块/元模块不接管 my_product 时自动退化为纯运行时方案(peak/min+看门狗仍保144)。
POLICY_ENABLE="1"          # 1=生成覆盖副本; 0=不生成(纯运行时方案, 改完重启)
POLICY_RATE="4"            # 策略词汇表144档: 0=未指定 1=90 2=60 3=120 4=144
# v1.6.0: 补 <config defaultMaxRate> 与每个 <item> 的 enableWinOverride="false"
# 没有 defaultMaxRate 时策略默认按 120 处理 app 切换 boost/浮窗; 不关 winOverride 时
# 应用可把频率往下 revise(掉 120 再被看门狗拉回)。空=不写 defaultMaxRate。
POLICY_DEFAULT_MAX_RATE="144"  # Hz 值(不是 rateId)
POLICY_WIN_OVERRIDE="all"      # all=所有 <item> 加 enableWinOverride="false"; off=不改