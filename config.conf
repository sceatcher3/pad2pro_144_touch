# ===== Pad 2 Pro 144Hz Fix 配置 =====
# 改完配置: 重启, 或 KSU 管理器里点模块的"操作"按钮立即应用

# ---- 刷新率 ----
REFRESH_PEAK="144.0"       # 峰值刷新率
REFRESH_MIN="144.0"        # 144=全局死锁; 改 "10.0" = 允许闲时降帧省电
USER_REFRESH_RATE="144"    # 写入 secure user_refresh_rate
OPLUS_REFRESH_KEY="4"      # secure oplus_customize_screen_refresh_rate: 144档=4
FORCE_USER_MODE="1"        # 1=设置用户首选显示模式(辅助, 单独不够)
FORCE_SF_MODE="1"          # 1=SurfaceFlinger 1035 强切(本机实测唯一有效, T4 实验)
SF_FALLBACK_ID="6"         # 解析失败时的兜底 SF mode id (本机 id6=144)

# ---- 触控 ----
TOUCH_GAME_SWITCH="1"      # 1=开启 /proc/touchpanel/game_switch_enable(官方游戏触控通道)
TOUCH_IRQ_AFFINITY="auto"  # auto=绑最强CPU簇; 0=关闭; 或CPU列表如 "6 7"

# ---- 看门狗 ----
WATCH_INTERVAL="5"         # 巡检间隔(秒), 灭屏时自动放宽到20秒
TARGET_HZ="144"

# ---- 策略源头覆盖(ColorOS 截断开关 maxrefreshsettings) ----
# v1.3.3: OverlayFS 路线 — 挂载交由 Hybrid Mount(默认 overlay 模式)自动合并,
# 本模块不手动 mount; POLICY_OVERLAY 仅作无元模块环境的手动 bind 兜底开关
POLICY_OVERLAY="0"         # 0=纯 OverlayFS 路线; 1=启用手动 bind-mount 兜底
POLICY_RATE="4"            # 策略词汇表144档: 0=未指定 1=90 2=60 3=120 4=144
