# ===== Pad 2 Pro 144Hz Fix 配置 (v1.5.2) =====
# 改完配置: 重启, 或模块管理器里点"操作"按钮立即应用; POLICY_* 开关只在开机早期生效, 必须重启

# ---- 刷新率 ----
# v1.5.2: 保 144 靠 peak=144 + min=120(保持 max-min>1, 系统才可切换) + 策略上限。
# SF 1035 在本机实测为空操作, 默认关闭; 看门狗漂移时会重写 min/peak 触发系统 modeset。
REFRESH_PEAK="144.0"       # 峰值刷新率(写入 system peak_refresh_rate)
# 120=保留高刷下限, 允许系统在 120/144 间切换(本机实测: min/peak 相等会让 ColorOS
# 进入"固定刷新率"状态, mRefreshRateChangeable=false, 亮屏后卡 120 不再 modeset)。
# 不要用 144.0; 改 "10.0" = 允许闲时降帧省电。
REFRESH_MIN="120.0"
USER_REFRESH_RATE="144"    # 写入 secure user_refresh_rate
OPLUS_REFRESH_KEY="4"      # secure oplus_customize_screen_refresh_rate: 144档=4
SF_FALLBACK_ID="6"         # 解析失败时的兜底 SF mode id (本机 id6=144)
# SF 1035 在本机 ColorOS 16.0.10.600 实测为空操作: 返回 Parcel(NULL), backdoor pid 始终 0,
# 切不动模式。默认关闭; 仅在其他 ROM/旧版本确认有效时才开。
SF_1035_ENABLE="0"

# ---- 触控(v1.5.0: 持久档位方案, 不再常驻写 game_switch) ----
# 档位表(官方 DTS): sensitive 0=255(厂商默认) 1=20 2=15 3=12 4=10 5=5
#                   smooth    0=255(厂商默认) 1=32 2=64 3=96 4=128 5=254
# 数值越小越灵敏/越少平滑(固件语义闭源, 方向以真机手感为准; 反了只改这里不改代码)
# -1 = 本模块不碰该节点; 充电插拔会切到厂商 charging 表, 接受不补写
TOUCH_SENSITIVE_LEVEL="4"  # /proc/touchpanel/sensitive_level 选档(0-5, -1=不动)
TOUCH_SMOOTH_LEVEL="1"     # /proc/touchpanel/smooth_level 选档(0-5, -1=不动)
TOUCH_IRQ_AFFINITY="auto"  # auto=绑最强CPU簇; 0=关闭; 或CPU列表如 "6 7"

# ---- 看门狗(v1.5.2: 验实测/模式/可切换性, 不再默认依赖 SF 1035) ----
WATCH_INTERVAL="10"        # 亮屏稳态巡检间隔(秒); 灭屏固定20s; 连续失败退避至60s封顶
TARGET_HZ="144"

# ---- 策略源头覆盖(ColorOS 截断开关 maxrefreshsettings) ----
# 覆盖副本生成到 <模块>/my_product/etc/, 由元模块合并生效; 本模块不自挂载(v1.5.0)。
# 没装元模块/元模块不接管 my_product 时自动退化为纯运行时方案(peak/min+看门狗仍保144)。
POLICY_ENABLE="1"          # 1=生成覆盖副本; 0=不生成(纯运行时方案, 改完重启)
POLICY_RATE="4"            # 策略词汇表144档: 0=未指定 1=90 2=60 3=120 4=144