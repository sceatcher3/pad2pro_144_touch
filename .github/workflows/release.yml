name: release

# 推 v* tag 即打包发版；已存在的 release 只补/覆盖资产，不重复创建
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble module zip
        run: |
          set -eu
          NAME=pad2pro_144_touch
          ZIP="${NAME}-${GITHUB_REF_NAME}.zip"
          stage="$(mktemp -d)"
          # 只装运行时文件：安装器 + 核心脚本 + 配置 + WebUI + 诊断脚本
          for f in module.prop config.conf customize.sh post-fs-data.sh service.sh \
                   apply.sh action.sh uninstall.sh; do
            cp -a "$f" "$stage/"
          done
          cp -a webroot tools "$stage/"
          find "$stage" -name '.DS_Store' -delete
          ( cd "$stage" && zip -r -q "${GITHUB_WORKSPACE}/${ZIP}" . )
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          unzip -l "${GITHUB_WORKSPACE}/${ZIP}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi